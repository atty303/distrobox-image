[scroll]
# Copy this file and replace the reserved value with a published immutable tag.
image=ghcr.io/atty303/arch-scroll:reserved-not-published
pull=true
# Need this to work with logind
volume=/run/dbus/system_bus_socket:/run/dbus/system_bus_socket
volume=/run/user/1000/X11-unix:/tmp/.X11-unix
# https://github.com/89luca89/distrobox/issues/1961
additional_flags="--userns keep-id:size=65534 --annotation run.oci.keep_original_groups=0"
exported_bins="/usr/bin/scroll /usr/bin/scrollmsg /usr/bin/scrollnag /usr/bin/scrollbar"
# Delegate selected desktop commands to the host through host-spawn.
init_hooks=ln -sf /usr/bin/host-exec /usr/local/bin/uwsm;
init_hooks=ln -sf /usr/bin/host-exec /usr/local/bin/vicinae;
start_now=true

[scroll-nvidia]
include=scroll
nvidia=true
