schema = 3
name = "arch-scroll"
repository = "ghcr.io/atty303/arch-scroll"
base = "quay.io/toolbx/arch-toolbox:latest"
context = ".."
containerfile = "Containerfile"
tag = "scroll-{aur.version}-{event_hash8}"

[[triggers]]
id = "aur"
type = "aur-version"
role = "build"
package = "sway-scroll"
build_arg = "SCROLL_VERSION"
revision_arg = "AUR_COMMIT"
label = "io.atty303.distrobox.scroll-version"

[[triggers]]
id = "host-spawn"
type = "github-release"
role = "input"
repository = "1player/host-spawn"
channel = "stable"
build_arg = "HOST_SPAWN_VERSION"
asset_pattern = "host-spawn-x86_64"
url_arg = "HOST_SPAWN_URL"
checksum_arg = "HOST_SPAWN_SHA256"
label = "io.atty303.distrobox.host-spawn-version"

[reference]
section = "scroll"
nvidia_section = "scroll-nvidia"

[[smoke]]
command = ["/usr/bin/scroll", "--version"]
[[smoke]]
command = ["sh", "-c", "installed=$(pacman -Q sway-scroll | awk '{print $2}') && test \"${installed%-*}\" = \"$LOCK_AUR_VERSION\""]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollmsg"]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollnag"]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollbar"]
[[smoke]]
command = ["sh", "-c", "host-spawn --version | grep -F \"$LOCK_HOST_SPAWN_VERSION\""]

[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/uwsm)\" = /usr/bin/host-exec"]
[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/vicinae)\" = /usr/bin/host-exec"]
