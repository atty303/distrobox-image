schema = 3
name = "arch-scroll"
repository = "ghcr.io/atty303/arch-scroll"
base = "quay.io/toolbx/arch-toolbox:latest"
context = ".."
containerfile = "Containerfile"
tag = "scroll-{scroll.version}-{event_hash8}"

[[triggers]]
id = "scroll"
type = "github-release"
role = "build"
repository = "atty303/scroll"
channel = "stable"
build_arg = "SCROLL_RELEASE"
revision_arg = "SCROLL_COMMIT"
label = "io.atty303.distrobox.scroll-source-commit"
label_source = "revision"

[[triggers]]
id = "aur"
type = "aur-version"
role = "input"
package = "sway-scroll"
revision_arg = "AUR_COMMIT"
label = "io.atty303.distrobox.scroll-recipe-commit"
label_source = "revision"

[reference]
section = "scroll"
nvidia_section = "scroll-nvidia"

[[smoke]]
command = ["/usr/bin/scroll", "--version"]
[[smoke]]
command = ["sh", "-c", "installed=$(pacman -Q sway-scroll | awk '{print $2}') && expected=$(printf '%s\\n' \"$LOCK_SCROLL_VERSION\" | sed 's/-atty\\./.atty./') && test \"${installed%-*}\" = \"$expected\""]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollmsg"]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollnag"]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollbar"]
[[smoke]]
command = ["host-spawn", "--version"]

[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/uwsm)\" = /usr/bin/host-exec"]
[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/vicinae)\" = /usr/bin/host-exec"]
