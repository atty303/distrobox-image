schema = 2
name = "arch-scroll"
repository = "ghcr.io/atty303/arch-scroll"
context = "."
containerfile = "Containerfile"
tag = "scroll-{scroll.version}-{event_hash8}"

[parent]
image = "arch-toolbox-paru"
propagation = "on-next-build"

[[triggers]]
id = "scroll"
type = "github-release"
role = "build"
repository = "dawsers/scroll"
channel = "stable"
build_arg = "SCROLL_VERSION"
revision_arg = "SCROLL_COMMIT"
label = "io.atty303.distrobox.scroll-version"

[[triggers]]
id = "aur"
type = "aur-version"
role = "gate"
package = "sway-scroll"
matches = "scroll"
revision_arg = "AUR_COMMIT"
label = "io.atty303.distrobox.aur-commit"
label_source = "revision"

[reference]
file = "reference/distrobox/scroll.ini"
section = "scroll"
nvidia_section = "scroll-nvidia"

[[smoke]]
command = ["/usr/bin/scroll", "--version"]
[[smoke]]
command = ["sh", "-c", "installed=$(pacman -Q sway-scroll | awk '{print $2}') && test \"${installed%-*}\" = \"$LOCK_SCROLL_VERSION\""]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollmsg"]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollnag"]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollbar"]

[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/uwsm)\" = /usr/bin/host-exec"]
[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/vicinae)\" = /usr/bin/host-exec"]
