schema = 2
name = "arch-scroll"
repository = "ghcr.io/atty303/arch-scroll"
context = "."
containerfile = "Containerfile"
tag = "scroll-{aur.version}-{event_hash8}"

[parent]
image = "arch-toolbox-paru"
propagation = "on-next-build"

[[triggers]]
id = "aur"
type = "aur-version"
role = "build"
package = "sway-scroll"
build_arg = "SCROLL_VERSION"
revision_arg = "AUR_COMMIT"
label = "io.atty303.distrobox.scroll-version"

[reference]
section = "scroll"
nvidia_section = "scroll-nvidia"

[[smoke]]
command = ["/usr/bin/scroll", "--version"]
[[smoke]]
command = ["sh", "-c", "installed=$(pacman -Q sway-scroll | awk '{print $2}') && test \"${installed%-*}\" = \"$LOCK_AUR_VERSION\""]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollmsg"]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollnag"]
[[smoke]]
command = ["test", "-x", "/usr/bin/scrollbar"]

[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/uwsm)\" = /usr/bin/host-exec"]
[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/vicinae)\" = /usr/bin/host-exec"]
