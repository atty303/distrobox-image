schema = 3
name = "arch-noctalia"
repository = "ghcr.io/atty303/arch-noctalia"
base = "quay.io/toolbx/arch-toolbox:latest"
context = ".."
containerfile = "Containerfile"
tag = "noctalia-{event_hash8}"

[[triggers]]
id = "aur-source"
type = "git-commit"
role = "build"
repository = "https://aur.archlinux.org/noctalia.git"
ref = "HEAD"
build_arg = "AUR_COMMIT"
label = "io.atty303.distrobox.aur-commit"

[[triggers]]
id = "host-spawn"
type = "github-release"
role = "input"
repository = "1player/host-spawn"
channel = "stable"
build_arg = "HOST_SPAWN_VERSION"
asset_pattern = "host-spawn-x86_64"
url_arg = "HOST_SPAWN_URL"
checksum_arg = "HOST_SPAWN_SHA256"
label = "io.atty303.distrobox.host-spawn-version"

[reference]
section = "noctalia"
nvidia_section = "noctalia-nvidia"

[[smoke]]
command = ["/usr/bin/noctalia", "--version"]
[[smoke]]
command = ["pacman", "-Q", "noctalia"]
[[smoke]]
command = ["test", "-f", "/usr/share/noctalia/assets/templates/scroll/scroll"]
[[smoke]]
command = ["test", "-f", "/usr/lib/spa-0.2/support/libspa-support.so"]
[[smoke]]
command = ["pacman", "-Q", "pipewire", "wireplumber"]
[[smoke]]
command = ["sh", "-c", "! ldd /usr/bin/noctalia | grep -F 'not found'"]
[[smoke]]
command = ["sh", "-c", "host-spawn --version | grep -F \"$LOCK_HOST_SPAWN_VERSION\""]

[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/uwsm)\" = /usr/bin/host-exec"]
[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/ghostty)\" = /usr/bin/host-exec"]
