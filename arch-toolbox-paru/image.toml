schema = 2
name = "arch-toolbox-paru"
repository = "ghcr.io/atty303/arch-toolbox-paru"
context = "."
containerfile = "Containerfile"
tag = "arch-{year}-{month}-{event_hash8}"

[parent]
external = "quay.io/toolbx/arch-toolbox@sha256:38d89c96265cfa7d6795c2e6f4b5b803df3e1f3d934fcfbabb346153aabdf985"
propagation = "on-next-build"

[[triggers]]
id = "base"
type = "oci-digest"
role = "build"
image = "quay.io/toolbx/arch-toolbox:latest"
monthly = true

[[triggers]]
id = "paru"
type = "github-release"
role = "build"
repository = "Morganamilo/paru"
channel = "stable"
build_arg = "PARU_VERSION"
label = "io.atty303.distrobox.paru-version"

[[triggers]]
id = "paru-source"
type = "git-commit"
role = "input"
repository = "https://github.com/Morganamilo/paru.git"
ref = "HEAD"
build_arg = "PARU_COMMIT"
label = "io.atty303.distrobox.paru-commit"

[[triggers]]
id = "host-spawn"
type = "github-release"
role = "build"
repository = "1player/host-spawn"
channel = "stable"
build_arg = "HOST_SPAWN_VERSION"
asset_pattern = "host-spawn-x86_64"
url_arg = "HOST_SPAWN_URL"
checksum_arg = "HOST_SPAWN_SHA256"
label = "io.atty303.distrobox.host-spawn-version"

[[smoke]]
command = ["sh", "-c", "paru --version | grep -F \"$LOCK_PARU_VERSION\""]
[[smoke]]
command = ["sh", "-c", "host-spawn --version | grep -F \"$LOCK_HOST_SPAWN_VERSION\""]
