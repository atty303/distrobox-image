name: Build immutable images

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "arch-*/**"
      - "common/**"
      - "ci/**"
      - "deno.json"
      - "deno.lock"
      - ".mise.toml"
      - "mise.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      image:
        description: Image name or all
        type: string
        default: all
      force:
        description: Create a nonce-backed force event
        type: boolean
        default: false
      reason:
        description: Required reason for a force build
        type: string
        required: false

concurrency:
  group: immutable-image-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Resolve live inputs and create plan
        env:
          IMAGE: ${{ inputs.image || 'all' }}
          FORCE: ${{ inputs.force || 'false' }}
          FORCE_REASON: ${{ inputs.reason || '' }}
          FORCE_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_OUTPUT: plan.json
        run: mise run plan -- "$IMAGE" ${{ inputs.force && '--force' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolved-plan
          path: plan.json
          if-no-files-found: error

  publish:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resolved-plan
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
      - run: sudo apt-get update && sudo apt-get install --yes podman skopeo
      - run: mise run install:distrobox
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, smoke, and publish in dependency order
        env:
          LOCK_OUTPUT_DIR: production-locks
          RESULT_OUTPUT: publish-result.json
        run: mise run publish -- plan.json
      - name: Report published immutable tags
        if: success()
        run: |
          jq -r '.[] | "### Published: `\(.repository):\(.tag)`"' publish-result.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-results
          path: |
            production-locks
            publish-result.json
          if-no-files-found: warn
