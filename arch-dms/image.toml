schema = 3
name = "arch-dms"
repository = "ghcr.io/atty303/arch-dms"
base = "quay.io/toolbx/arch-toolbox:latest"
context = ".."
containerfile = "Containerfile"
tag = "dms-{dms.version}-dsearch-{dsearch.version}-{event_hash8}"

[[triggers]]
id = "dms"
type = "github-release"
role = "build"
repository = "AvengeMedia/DankMaterialShell"
channel = "stable"
build_arg = "DMS_VERSION"
asset_pattern = "dms-full-amd64.tar.gz"
url_arg = "DMS_BUNDLE_URL"
checksum_arg = "DMS_BUNDLE_SHA256"
label = "io.atty303.distrobox.dms-version"

[[triggers]]
id = "dsearch"
type = "github-release"
role = "build"
repository = "AvengeMedia/danksearch"
channel = "stable"
build_arg = "DSEARCH_VERSION"
asset_pattern = "dsearch-linux-amd64.gz"
url_arg = "DSEARCH_URL"
checksum_arg = "DSEARCH_SHA256"
label = "io.atty303.distrobox.dsearch-version"

[[triggers]]
id = "dgop"
type = "github-release"
role = "input"
repository = "AvengeMedia/dgop"
channel = "stable"
build_arg = "DGOP_VERSION"
asset_pattern = "dgop-linux-amd64.gz"
url_arg = "DGOP_URL"
checksum_arg = "DGOP_SHA256"
label = "io.atty303.distrobox.dgop-version"

[[triggers]]
id = "quickshell-aur"
type = "git-commit"
role = "input"
repository = "https://aur.archlinux.org/quickshell-git.git"
build_arg = "QUICKSHELL_AUR_COMMIT"

[[triggers]]
id = "quickshell"
type = "git-commit"
role = "input"
repository = "https://git.outfoxxed.me/quickshell/quickshell.git"
build_arg = "QUICKSHELL_COMMIT"
label = "io.atty303.distrobox.quickshell-commit"

[reference]
section = "dms"
nvidia_section = "dms-nvidia"

[[smoke]]
command = ["sudo", "-u", "builder", "--", "/usr/bin/dms", "version"]
[[smoke]]
command = ["test", "-f", "/usr/share/quickshell/dms/shell.qml"]
[[smoke]]
command = ["sh", "-c", "version=$(sed 's/^v//' /usr/share/quickshell/dms/VERSION) && test \"$version\" = \"$LOCK_DMS_VERSION\" && sudo -u builder -- dms version | grep -F \"$LOCK_DMS_VERSION\""]
[[smoke]]
command = ["test", "-x", "/usr/bin/qs"]
[[smoke]]
command = ["test", "-x", "/usr/bin/dgop"]
[[smoke]]
command = ["test", "-x", "/usr/bin/dsearch"]
[[smoke]]
command = ["host-spawn", "--version"]

[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/uwsm)\" = /usr/bin/host-exec"]
[[reference_smoke]]
command = ["sh", "-c", "test \"$(readlink /usr/local/bin/ghostty)\" = /usr/bin/host-exec"]
